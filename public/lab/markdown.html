<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简 Markdown 编辑器</title>
    <link rel="stylesheet" href="/lab/_lab.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif
        }

        .header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 15px 0 96px;
            background: #fff;
            border-bottom: 1px solid #eee
        }

        .title {
            font-size: 16px;
            font-weight: 600
        }

        .count {
            font-size: 12px;
            color: #999;
            white-space: nowrap
        }

        .container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 44px)
        }

        #editor {
            flex: 1;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            line-height: 1.6;
            border: none;
            outline: none;
            resize: none;
            background: #fafafa;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace
        }

        #preview {
            flex: 1;
            padding: 15px 20px 80px;
            overflow-y: auto;
            background: #fff
        }

        @media(min-width:768px) {
            .container {
                flex-direction: row
            }

            #editor,
            #preview {
                flex: 1;
                height: 100%
            }
        }

        .export {
            position: fixed;
            right: 15px;
            bottom: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #007aff;
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer
        }

        /* 预览区样式。刻意和站点的 .prose 对齐：
           这里看到的样子，就是文章发到博客上的样子。 */
        .md {
            font-size: 16px;
            line-height: 1.75;
            color: #1a1a1a;
            word-wrap: break-word
        }

        .md>*:first-child {
            margin-top: 0
        }

        .md h1,
        .md h2,
        .md h3,
        .md h4,
        .md h5,
        .md h6 {
            margin: 26px 0 12px;
            line-height: 1.3;
            font-weight: 600
        }

        .md h1 {
            font-size: 1.7em
        }

        .md h2 {
            font-size: 1.4em
        }

        .md h3 {
            font-size: 1.18em
        }

        .md p,
        .md ul,
        .md ol,
        .md blockquote,
        .md pre {
            margin: 14px 0
        }

        .md ul,
        .md ol {
            padding-left: 1.5em
        }

        .md li {
            margin: 6px 0
        }

        .md blockquote {
            padding: 2px 0 2px 16px;
            border-left: 3px solid #e2e2e2;
            color: #666
        }

        .md code {
            background: #f2f2f2;
            border-radius: 4px;
            padding: .15em .35em;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .88em
        }

        .md pre {
            background: #f7f7f7;
            border-radius: 8px;
            padding: 14px;
            overflow-x: auto
        }

        .md pre code {
            background: none;
            padding: 0
        }

        .md hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 26px 0
        }

        .md a {
            color: #007aff
        }

        .md img {
            max-width: 100%
        }
    </style>
</head>

<body>
    <a class="lab-back" href="/lab">← Lab</a>

    <div class="header">
        <div class="title">极简 Markdown</div>
        <div class="count" id="count">字数：0</div>
    </div>
    <div class="container">
        <textarea id="editor" spellcheck="false" placeholder="开始写作..."></textarea>
        <div id="preview" class="md"></div>
    </div>
    <button class="export" onclick="saveHtml()" title="导出预览的 HTML">↓</button>

    <script>
        var editor = document.getElementById('editor');
        var preview = document.getElementById('preview');
        var count = document.getElementById('count');

        // 渲染交给服务端 —— 和博客正文用的是同一份渲染器。
        // 原来这里从 CDN 拉 marked，不仅多一个外部依赖，
        // 还意味着「本地预览」和「发出去的样子」是两套规则，很容易对不上。
        var timer = null;
        var seq = 0;

        function update() {
            var text = editor.value;
            count.textContent = '字数：' + text.length;
            localStorage.setItem('md', text);

            clearTimeout(timer);
            timer = setTimeout(function () {
                var mine = ++seq;
                fetch('/api/lab/markdown', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                }).then(function (res) {
                    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
                }).then(function (r) {
                    if (mine !== seq) return;
                    preview.innerHTML = r.ok ? r.data.html : '<p>' + (r.data.error || '渲染失败') + '</p>';
                }).catch(function () {
                    if (mine !== seq) return;
                    preview.innerHTML = '<p>连不上服务器，预览暂时用不了。正文还在本地存着，不会丢。</p>';
                });
            }, 200);
        }

        editor.addEventListener('input', update);
        editor.value = localStorage.getItem('md') || '# 欢迎使用极简编辑器';
        update();

        window.saveHtml = function () {
            var a = document.createElement('a');
            a.download = 'markdown-' + Date.now() + '.html';
            a.href = URL.createObjectURL(new Blob([preview.innerHTML], { type: 'text/html' }));
            a.click();
        };
    </script>
</body>

</html>
