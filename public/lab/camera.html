<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相机</title>
    <link rel="stylesheet" href="/lab/_lab.css">
</head>

<body>
    <a class="lab-back" href="/lab">← Lab</a>

    <h1>相机</h1>

    <video id="video" autoplay playsinline muted></video>
    <p>
        <button id="shoot" onclick="takePhoto()">拍照</button>
        <button id="save" onclick="savePhoto()" disabled>保存</button>
    </p>
    <p id="status">正在请求摄像头权限…</p>
    <canvas id="canvas"></canvas>

    <script>
        var video = document.getElementById('video');
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        var status = document.getElementById('status');
        var saveBtn = document.getElementById('save');

        // 视频和画布都自适应宽度，实际像素在拿到画面后才对齐，避免拍出被拉伸的糊图
        video.style.width = '100%';
        video.style.maxWidth = '480px';
        video.style.background = '#000';

        // 摄像头只在安全上下文可用：https 或 localhost。
        // 直接用 IP 访问时浏览器会拒绝，这里把原因说清楚 —— 否则页面看起来就像坏了。
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            status.textContent = '这个浏览器不给用摄像头：需要 https 或 localhost 访问，用 IP 打开会被拦。';
        } else {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(function (stream) {
                    video.srcObject = stream;
                    status.textContent = '已开启。点「拍照」把画面定格到下面。';
                })
                .catch(function (err) {
                    status.textContent = '打不开摄像头：' + (err && err.name ? err.name : '未知错误') +
                        '。常见原因是页面不是 https，或者浏览器没给权限。';
                });
        }

        function takePhoto() {
            if (!video.videoWidth) {
                status.textContent = '画面还没准备好，稍等一下再拍。';
                return;
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.style.width = '100%';
            canvas.style.maxWidth = '480px';
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            saveBtn.disabled = false;
            status.textContent = '已定格 ' + canvas.width + '×' + canvas.height + '，可以保存。';
        }

        function savePhoto() {
            var a = document.createElement('a');
            a.download = 'photo-' + Date.now() + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        }
    </script>
</body>

</html>
