<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="/lab/_lab.css">
  <meta charset="utf-8">
  <title>2048</title>

  <!-- 这里的资源一律写绝对路径。
       页面地址是 /lab/2048（结尾没有斜杠），相对路径会被浏览器按父目录 /lab/ 解析，
       于是 style/main.css 变成 /lab/style/main.css —— 全部 404，整页没样式也没逻辑。
       写死 /lab/2048/ 前缀就与地址无关了。 -->
  <link href="/lab/2048/style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="/lab/2048/favicon.ico">
  <link rel="apple-touch-icon" href="/lab/2048/meta/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="/lab/2048/meta/apple-touch-startup-image-640x1096.png"
    media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone 5+ -->
  <link rel="apple-touch-startup-image" href="/lab/2048/meta/apple-touch-startup-image-640x920.png"
    media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPhone, retina -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport"
    content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
</head>

<body>
  <a class="lab-back" href="/lab">← Lab</a>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
        <div class="best-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
      <a class="restart-button">New Game</a>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
          <a class="keep-playing-button">Keep going</a>
          <a class="retry-button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container">

      </div>
    </div>

    <!-- <p class="game-explanation">
      <strong class="important">How to play:</strong> Use your <strong>arrow keys</strong> to move the tiles. When two
      tiles with the same number touch, they <strong>merge into one!</strong>
    </p>
    <hr> -->
    <!-- <p>
      Original game by <a href="https://github.com/gabrielecirulli/2048" target="_blank" rel="noopener">Gabriele Cirulli</a>,
      MIT licensed. Fork and extra demos by <a href="https://dontcallmelimohan.github.io" target="_blank" rel="noopener">Limohan</a>.
    </p> -->
  </div>

  <script src="/lab/2048/js/bind_polyfill.js"></script>
  <script src="/lab/2048/js/classlist_polyfill.js"></script>
  <script src="/lab/2048/js/animframe_polyfill.js"></script>
  <script src="/lab/2048/js/keyboard_input_manager.js"></script>
  <script src="/lab/2048/js/html_actuator.js"></script>
  <script src="/lab/2048/js/grid.js"></script>
  <script src="/lab/2048/js/tile.js"></script>
  <script src="/lab/2048/js/local_storage_manager.js"></script>
  <script src="/lab/2048/js/game_manager.js"></script>
  <script src="/lab/2048/js/application.js"></script>

</body>

</html>
